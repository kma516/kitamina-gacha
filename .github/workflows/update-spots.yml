name: update-spots

on:
  schedule:
    # 月曜 4:00 JST = 日曜 19:00 UTC
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-spots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 取得失敗・件数が前回の半分未満なら fetch-osm が exit 1 してここで止まる（コミットしない）
      - run: npm run fetch-osm

      - run: npm test

      - name: 差分があればコミット
        run: |
          if git diff --quiet -- data/spots.json; then
            echo "spots.json に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spots.json
          git commit -m "data: spots.json を更新（OpenStreetMap）"
          git push
